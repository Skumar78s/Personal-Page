<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Website</title>
    <meta name="description" content="Welcome to my personal website. Here you can find information about me, my projects, and how to contact me."> 
    <meta name="keywords" content="personal website, portfolio, projects, contact">
    <meta name="author" content="Surendra Majhi">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ddd9fc;
        }
        .intro {
            text-align: center;
            padding: 50px;

        }
        .profile-picture img {
            border-radius: 50%;
            box-sizing: border-box;
                border: 5px solid #007BFF;

        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }
        button a {
            color: white;
            text-decoration: none;
        }
        button:hover {
            background-color: #0056b3;
        }
        h1{
            color: #333;
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }
        .it{
            color: #555;
            font-size: 50px;
            margin-top: 10px;
        }
        p {
            color: #666;
            font-size: medium;
            margin-top: 20px;
            line-height: 1.6;
            font-size: larger;
        }


    </style>
</head>
<body>
    <div class="intro">
        <div class="profile-picture">
            <img src="img/profileimg.png" alt="Profile Picture" width="350" height="350">
        </div>

        <h1>Surendra Majhi</h1>
        <p class="it">Welcome to my personal website!</p>
        <p>I'm a software developer with a passion for creating innovative solutions. Here you can find information about my projects, skills, and how to contact me.</p>
        <button> <a href="main.html">Get in Touch</a> </button>
    </div>
</body>
</html>
